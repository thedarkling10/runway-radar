name: CI pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync
      
      - name: Build database
        run: uv run python -m runway_radar.api.load_db
       
      - name: Run the tests
        run: uv run pytest

