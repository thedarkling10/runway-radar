[project]
name = "runway-radar"
version = "0.1.0"
description = "Trend-forecasting dashboard for Gucci's Alessandro Michele runway era, using CLIP zero-shot attribute extraction"
readme = "README.md"
authors = [
    { name = "thedarkling10", email = "cioiualexandra@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.1",
    "open-clip-torch>=3.3.0",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pillow-avif-plugin>=1.6.0",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "streamlit>=1.60.0",
    "torch>=2.13.0",
]

[project.scripts]
runway-radar = "runway_radar:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
